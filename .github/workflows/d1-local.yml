name: GewinnRadar Wrangler D1 local
on:
  push:
    branches:
      - feature/admin-review-login-hardening-v03
      - feature/advent-catalog-quality-v04
  pull_request:
permissions:
  contents: read
jobs:
  d1-local:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real Wrangler local D1 schema migrations (no remote account)
        run: |
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --file migrations/0001_initial.sql
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --file migrations/0002_review_security.sql
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --file migrations/0003_catalog_staging.sql
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --command "PRAGMA foreign_key_check;"
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','games','contest_evidence','admin_audit','login_limits','research_candidates','research_import_log') ORDER BY name;"
