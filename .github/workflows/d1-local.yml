name: GewinnRadar Wrangler D1 local
on:
  push:
    branches:
      - feature/admin-review-login-hardening-v03
      - feature/advent-catalog-quality-v04
      - feature/advent-source-evidence-v05
      - feature/verified-form-and-deadline-guards-v06
  pull_request:
permissions:
  contents: read
jobs:
  d1-local:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real Wrangler local D1 schema migrations (no remote account)
        run: |
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --file migrations/0001_initial.sql
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --file migrations/0002_review_security.sql
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --file migrations/0003_catalog_staging.sql
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --file migrations/0004_source_evidence.sql
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --file migrations/0005_form_and_reminders.sql
          # Recovery migration is applied only to an isolated CI-local database, never Production.
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --file migrations/0006_admin_bootstrap.sql
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --file migrations/0006_admin_bootstrap.sql
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --command "SELECT CASE WHEN (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='admin_bootstrap')=1 AND (SELECT COUNT(*) FROM admin_bootstrap)=0 THEN 1 ELSE json_extract('invalid-json',char(36)) END AS migration_0006_ok;"
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --command "PRAGMA foreign_key_check;"
          npx --yes wrangler@4 d1 execute gewinnradar-ci-only --local --config scripts/wrangler-ci.toml --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','games','contest_evidence','admin_audit','login_limits','research_candidates','research_import_log') ORDER BY name;"
