name: GewinnRadar offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -eu
          find . \( -name '*.js' -o -name '*.mjs' \) -type f -print0 | xargs -0 -r -n 1 node --check
      - name: Unit and API boundary tests
        run: npm test
      - name: Audit all researched original-source candidates
        run: node scripts/catalog-audit.mjs
      - name: Validate dated 2026 source evidence
        run: node scripts/audit-evidence.mjs
      - name: Verify all 2026 editorial decisions and disabled reminders
        run: node scripts/audit-editorial.mjs
      - name: Offline SQLite migrations and isolation
        run: python3 scripts/test_schema.py
