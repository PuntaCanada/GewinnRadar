<title>GewinnRadar – Einmaliger Admin-Test</title><link rel="stylesheet" href="/style.css">

<body><main class="wrap"><section class="panel">
<h1>GewinnRadar ❤️ – einzelner Admin-Test</h1>
<p>Diese Funktion ist standardmäßig gesperrt. Ein erfolgreicher Test kann höchstens eine Anmeldemail an das bestehende einzige Administratorkonto anfordern. Keine tägliche Erinnerung und keine öffentliche Registrierung.</p>
<form id="testForm"><label for="testCode">Privater einmaliger Testcode</label>
<input type="password" id="testCode" autocomplete="off" minlength="32" required>
<button type="submit">Einmaligen Admin-Test auslösen</button></form>
<p id="message" role="status" aria-live="polite"></p>
<p><a href="/">Zurück zu GewinnRadar</a></p>
</section></main></body></html>
